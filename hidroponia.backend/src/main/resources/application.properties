spring.application.name=hidroponia-backend
spring.config.import=optional:file:.env[.properties],optional:file:hidroponia.backend/.env[.properties]

server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Base de Datos PostgreSQL (esquema idempotente en schema.sql)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/axion_hidroponia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# IoT HTTP (ESP32-S3)
axion.iot.device-key=${IOT_DEVICE_KEY:axion_dev_esp32_key_2026}

# Seguridad / JWT / Admin
axion.security.jwt-secret=${JWT_SECRET:axion_dev_jwt_secret_key_change_in_production_2026}
axion.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:1800000}
axion.admin.email=${ADMIN_EMAIL:admin@universidad.edu}
axion.admin.password=${ADMIN_PASSWORD:axion2026}

# CORS
axion.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
