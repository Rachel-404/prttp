spring.application.name=hidroponia-backend
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Base de Datos PostgreSQL + TimescaleDB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/axion_hidroponia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# MQTT (ESP32-S3)
axion.mqtt.enabled=${MQTT_ENABLED:true}
axion.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
axion.mqtt.client-id=${MQTT_CLIENT_ID:axion_springboot_backend}
axion.mqtt.username=${MQTT_USERNAME:esp32_nodo_01}
axion.mqtt.password=${MQTT_PASSWORD:}
axion.mqtt.topic-telemetria=${MQTT_TOPIC_TELEMETRIA:axion/hidroponia/telemetria}
axion.mqtt.topic-comandos=${MQTT_TOPIC_COMANDOS:axion/hidroponia/comandos}

# Seguridad / JWT / Admin
axion.security.jwt-secret=${JWT_SECRET:axion_dev_jwt_secret_key_change_in_production_2026}
axion.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:1800000}
axion.admin.email=${ADMIN_EMAIL:admin@universidad.edu}
axion.admin.password=${ADMIN_PASSWORD:axion2026}

# CORS
axion.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
