<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIÓN - IOT | Iniciar Sesión</title>
    <meta name="description" content="Acceso administrativo al sistema de monitoreo y control hidropónico AXIÓN - IOT.">
    <meta name="keywords" content="hidroponía, IoT, inicio de sesión, administrador, AXIÓN">
    <meta name="author" content="AXIÓN - IOT">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://axion-iot.local/login.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AXIÓN - IOT">
    <meta property="og:locale" content="es_PE">
    <meta property="og:title" content="AXIÓN - IOT | Iniciar Sesión">
    <meta property="og:description" content="Portal de autenticación administrativa para AXIÓN - IOT.">
    <meta property="og:url" content="https://axion-iot.local/login.html">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AXIÓN - IOT | Iniciar Sesión">
    <meta name="twitter:description" content="Portal de autenticación administrativa para AXIÓN - IOT.">

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "AXIÓN - IOT",
            "applicationCategory": "AgriculturalApplication",
            "operatingSystem": "Web",
            "inLanguage": "es",
            "description": "Pantalla de inicio de sesión para administración del sistema hidropónico AXIÓN - IOT."
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="pagina-login">
    <main class="login-main">
        <section class="card login-card" aria-labelledby="login-titulo">
            <header class="login-encabezado">
                <div class="login-logo-contenedor">
                    <img class="login-logo-img" src="img/logo.png" alt="Logo AXIÓN IOT">
                </div>
                <h1 id="login-titulo" class="login-titulo">AXIÓN - IOT</h1>
                <p class="login-subtitulo">Acceso al Sistema de Monitoreo y Control Hidropónico</p>
            </header>

            <form id="form-login" class="login-formulario" novalidate>
                <div class="grupo-campo">
                    <label for="login-email" class="etiqueta-campo">Correo Institucional</label>
                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        class="campo-control"
                        placeholder="Correo institucional"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="grupo-campo">
                    <label for="login-password" class="etiqueta-campo">Contraseña</label>
                    <div class="campo-password-wrapper">
                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            class="campo-control campo-password"
                            placeholder="Ingresa tu contraseña"
                            required
                            autocomplete="current-password"
                        >
                        <button
                            type="button"
                            id="btn-toggle-password"
                            class="btn-ver-password"
                            aria-label="Mostrar contraseña"
                            aria-pressed="false"
                        >
                            <svg id="icono-ojo-mostrar" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="icono-ojo-ocultar" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="login-opciones">
                    <label for="login-recordar" class="checkbox-etiqueta">
                        <input type="checkbox" id="login-recordar" name="recordar" class="checkbox-control">
                        <span>Mantener sesión iniciada</span>
                    </label>
                    <button type="button" id="btn-recuperar-acceso" class="enlace-recuperar">
                        Recuperar acceso
                    </button>
                </div>

                <div id="login-feedback" class="login-feedback" role="alert" aria-live="polite" hidden>
                    <span class="punto-feedback" aria-hidden="true"></span>
                    <span id="login-feedback-texto"></span>
                </div>

                <button type="submit" id="btn-ingresar" class="btn-modal btn-modal-activar btn-login-submit">
                    Ingresar al Sistema
                </button>
            </form>

            <footer class="login-pie">
                <a href="index.html" class="enlace-retorno-publico">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Volver al Panel Público (Solo Lectura)</span>
                </a>
            </footer>
        </section>
    </main>

    <div id="modal-recuperar-acceso" class="modal-overlay" hidden>
        <div class="modal-caja" role="dialog" aria-modal="true" aria-live="polite" aria-labelledby="modal-recuperar-titulo" aria-describedby="modal-recuperar-mensaje">
            <h2 id="modal-recuperar-titulo" class="modal-titulo">Recuperación de Acceso</h2>
            <p id="modal-recuperar-mensaje" class="modal-mensaje">
                Ingresa el token de recuperación física del controlador ESP32-S3 y define una nueva contraseña para el Administrador Único.
            </p>
            <form id="form-recuperar-acceso" class="modal-login-form" novalidate>
                <div class="grupo-campo">
                    <label for="rec-token" class="etiqueta-campo">Token de Recuperación de Emergencia</label>
                    <input type="text" id="rec-token" name="tokenRecuperacion" class="campo-control" placeholder="Token de recuperación" required>
                </div>
                <div class="grupo-campo">
                    <label for="rec-password-nueva" class="etiqueta-campo">Nueva Contraseña</label>
                    <input type="password" id="rec-password-nueva" name="passwordNueva" class="campo-control" placeholder="Nueva contraseña" required>
                </div>
                <div class="grupo-campo">
                    <label for="rec-password-confirmar" class="etiqueta-campo">Confirmar Nueva Contraseña</label>
                    <input type="password" id="rec-password-confirmar" name="passwordConfirmar" class="campo-control" placeholder="Confirmar contraseña" required>
                </div>
                <footer class="modal-acciones">
                    <button type="button" id="btn-cerrar-recuperar" class="btn-modal btn-modal-cancelar">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-modal btn-modal-activar">
                        Restablecer Contraseña
                    </button>
                </footer>
            </form>
        </div>
    </div>

    <div id="toast-login" class="toast-notificacion" role="status" aria-live="polite" hidden></div>

    <script src="js/login.js"></script>
</body>

</html>
