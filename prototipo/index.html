<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD - AXIÓN IOT</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/temperatura.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/footer.css">
    <!-- FontAwesome 6 para iconos fa-solid monocromáticos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@600&family=Silkscreen&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Contenedor del Header superior -->
    <div id="header-container"></div>

    <!-- Contenedor del Sidebar (Drawer deslizable) -->
    <div id="sidebar-container"></div>

    <div class="fondo-transparente">
        <div class="contenedor-card">
            <div class="tarjeta sombra">
                <div>
                    <div class="icono">
                        <span class="material-symbols-outlined">favorite</span>
                    </div>
                </div>
                <h1 class="txt-card">25°C</h1>
                <div>
                    <div>
                        <h3>Sensor [Nombre Nombre Nombre Nombre]</h3>
                    </div>
                    <div class="txt-descr">
                        <p>Estado: blablabla</p>
                    </div>
                    <div class="txt-mini">
                        <p>Ultima Actualización: dd/mm/aaaa</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor del Footer inferior -->
    <div id="footer-container"></div>

    <script src="js/main.js"></script>
</body>

</html>
